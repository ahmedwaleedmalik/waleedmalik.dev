<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" font-family="'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'Geist Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace; }
      .cap   { fill:#8a8a8a; font-size:13.5px; }
      .node  { fill:#ededed; font-size:14px; font-weight:700; }
      .ndesc { fill:#8a8a8a; font-size:11px; }
      .band  { fill:#bcbcbc; font-size:13px; font-weight:600; }
      .tag   { fill:#cfcfcf; font-size:11.5px; }
      .pill  { fill:#2a2a2a; stroke:#404040; stroke-width:1; }
      .err   { fill:#c98a8a; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="588" rx="10" fill="#1c1c1c"/>

  <!-- caption (heading lives in the prose, not here) -->
  <text x="56" y="50" class="cap">The GPU stack is the provider's territory. Your portability lives one layer up.</text>

  <!-- portable platform band (top) -->
  <rect x="56" y="84" width="848" height="92" rx="12" fill="#202020" stroke="#333333"/>
  <rect x="56" y="84" width="4" height="92" rx="2" fill="#6a6a6a"/>
  <text x="80" y="130" class="node" font-size="16">Inference Platform</text>
  <text x="80" y="153" class="ndesc" font-size="12">Serving · Routing · Scheduling · Observability · GitOps — runs on any conformant cluster</text>
  <g class="mono">
    <rect x="556" y="110" width="78" height="26" rx="7" class="pill"/><text x="595" y="127" class="tag" text-anchor="middle">vLLM</text>
    <rect x="644" y="110" width="74" height="26" rx="7" class="pill"/><text x="681" y="127" class="tag" text-anchor="middle">GIE</text>
    <rect x="728" y="110" width="80" height="26" rx="7" class="pill"/><text x="768" y="127" class="tag" text-anchor="middle">Argo CD</text>
    <rect x="818" y="110" width="68" height="26" rx="7" class="pill"/><text x="852" y="127" class="tag" text-anchor="middle">ESO</text>
  </g>

  <!-- the line -->
  <line x1="56" y1="206" x2="904" y2="206" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="2 6"/>
  <text x="56" y="200" class="ndesc mono" fill="#6f6f6f">the line tutorials never draw</text>

  <!-- provider stack chain (bottom) -->
  <g>
    <!-- 1 GPU -->
    <rect x="56" y="244" width="128" height="78" rx="11" fill="#242424" stroke="#333333"/>
    <text x="120" y="277" class="node" text-anchor="middle">GPU (L4)</text>
    <text x="120" y="298" class="ndesc" text-anchor="middle">the silicon</text>
    <path d="M186 283 h12" stroke="#6a6a6a" stroke-width="2"/><polygon points="200,283 192,279 192,287" fill="#6a6a6a"/>
    <!-- 2 driver -->
    <rect x="202" y="244" width="128" height="78" rx="11" fill="#242424" stroke="#333333"/>
    <text x="266" y="277" class="node" text-anchor="middle">Kernel driver</text>
    <text x="266" y="298" class="ndesc" text-anchor="middle">nvidia.ko</text>
    <path d="M332 283 h12" stroke="#6a6a6a" stroke-width="2"/><polygon points="346,283 338,279 338,287" fill="#6a6a6a"/>
    <!-- 3 containerd (failure node) -->
    <rect x="348" y="244" width="128" height="78" rx="11" fill="#242424" stroke="#7a5a5a" stroke-width="1.6"/>
    <text x="412" y="277" class="node" text-anchor="middle">containerd</text>
    <text x="412" y="298" class="ndesc" text-anchor="middle">runtime config</text>
    <path d="M478 283 h12" stroke="#6a6a6a" stroke-width="2"/><polygon points="492,283 484,279 484,287" fill="#6a6a6a"/>
    <!-- 4 device plugin -->
    <rect x="494" y="244" width="128" height="78" rx="11" fill="#242424" stroke="#333333"/>
    <text x="558" y="273" class="node" text-anchor="middle">Device plugin</text>
    <text x="558" y="294" class="ndesc" text-anchor="middle">advertises gpu</text>
    <path d="M624 283 h12" stroke="#6a6a6a" stroke-width="2"/><polygon points="638,283 630,279 630,287" fill="#6a6a6a"/>
    <!-- 5 kubelet -->
    <rect x="640" y="244" width="128" height="78" rx="11" fill="#242424" stroke="#333333"/>
    <text x="704" y="277" class="node" text-anchor="middle">kubelet</text>
    <text x="704" y="298" class="ndesc" text-anchor="middle">schedules</text>
    <path d="M770 283 h12" stroke="#6a6a6a" stroke-width="2"/><polygon points="784,283 776,279 776,287" fill="#6a6a6a"/>
    <!-- 6 pod -->
    <rect x="786" y="244" width="118" height="78" rx="11" fill="#262626" stroke="#4a4a4a"/>
    <text x="845" y="273" class="node" text-anchor="middle">Pod sees</text>
    <text x="845" y="294" class="mono" text-anchor="middle" fill="#bcbcbc" font-size="11">nvidia.com/gpu</text>
  </g>

  <!-- failure callout on containerd -->
  <path d="M412 322 v22" stroke="#7a5a5a" stroke-width="1.4" stroke-dasharray="2 4"/>
  <rect x="300" y="346" width="404" height="64" rx="10" fill="#221a1a" stroke="#7a5a5a"/>
  <text x="318" y="370" class="err mono">nvidia-ctk writes 99-nvidia.toml →</text>
  <text x="318" y="389" class="mono" fill="#b39a9a" font-size="11.5">GKE ignores the drop-in dir. Registration</text>
  <text x="318" y="405" class="mono" fill="#b39a9a" font-size="11.5">goes nowhere: no runtime for "nvidia" is configured</text>

  <!-- provider bracket -->
  <path d="M56 430 v10 h848 v-10" fill="none" stroke="#3a3a3a" stroke-width="1.4"/>
  <rect x="222" y="444" width="516" height="34" rx="9" fill="#212121" stroke="#333333"/>
  <text x="480" y="466" class="band" text-anchor="middle">Managed Kubernetes Provider's territory; consume, don't re-run</text>

  <text x="56" y="510" class="ndesc" font-size="12">On managed Kubernetes the node OS is owned by the provider. The self-managed GPU Operator loses the fight at containerd.</text>
</svg>
