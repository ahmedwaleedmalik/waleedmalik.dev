<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 812" font-family="'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'Geist Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace; }
      .h1   { fill:#ededed; font-size:23px; font-weight:700; letter-spacing:-0.3px; }
      .cap  { fill:#8a8a8a; font-size:13px; }
      .lyr  { fill:#ededed; font-size:18px; font-weight:700; letter-spacing:-0.2px; }
      .desc { fill:#8a8a8a; font-size:13px; }
      .idx  { fill:#8a8a8a; font-size:13px; font-weight:700; }
      .tag  { fill:#2a2a2a; stroke:#404040; stroke-width:1; }
      .tagt { fill:#cfcfcf; font-size:12px; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="812" rx="10" fill="#1c1c1c"/>

  <!-- header -->
  <text x="56" y="58" class="h1">LLM inference stack</text>
  <text x="56" y="82" class="cap mono">Lifecycle of a request top to bottom · GitOps-reconciled on Kubernetes</text>

  <!-- request flow spine -->
  <line x1="58" y1="134" x2="58" y2="676" stroke="#5a5a5a" stroke-width="2"/>
  <polygon points="58,688 52,676 64,676" fill="#8a8a8a"/>

  <!-- ============ LAYER 01 — Experience ============ -->
  <g>
    <rect x="80" y="100" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="143" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="120" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="147" class="idx mono">01</text>
    <text x="158" y="141" class="lyr">Experience</text>
    <text x="158" y="163" class="desc">Developer and end-user surfaces</text>
    <g class="mono"><rect x="612" y="130" width="92" height="26" rx="7" class="tag"/><text x="658" y="147" class="tagt" text-anchor="middle">Open WebUI</text>
    <rect x="714" y="130" width="57" height="26" rx="7" class="tag"/><text x="742" y="147" class="tagt" text-anchor="middle">n8n</text>
    <rect x="781" y="130" width="43" height="26" rx="7" class="tag"/><text x="802" y="147" class="tagt" text-anchor="middle">SDK</text></g>
  </g>

  <!-- ============ LAYER 02 — Tenant edge ============ -->
  <g>
    <rect x="80" y="202" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="245" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="222" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="249" class="idx mono">02</text>
    <text x="158" y="243" class="lyr">Tenant edge · LiteLLM</text>
    <text x="158" y="265" class="desc">Tenancy boundary: identity, budgets, guardrails</text>
    <g class="mono"><rect x="468" y="216" width="106" height="26" rx="7" class="tag"/><text x="521" y="233" class="tagt" text-anchor="middle">virtual keys</text>
    <rect x="584" y="216" width="71" height="26" rx="7" class="tag"/><text x="619" y="233" class="tagt" text-anchor="middle">budgets</text>
    <rect x="665" y="216" width="106" height="26" rx="7" class="tag"/><text x="718" y="233" class="tagt" text-anchor="middle">spend ledger</text>
    <rect x="781" y="216" width="43" height="26" rx="7" class="tag"/><text x="802" y="233" class="tagt" text-anchor="middle">SSO</text>
    <rect x="655" y="248" width="169" height="26" rx="7" class="tag"/><text x="739" y="265" class="tagt" text-anchor="middle">PII + injection guard</text></g>
  </g>

  <!-- ============ LAYER 03 — Routing ============ -->
  <g>
    <rect x="80" y="304" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="347" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="324" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="351" class="idx mono">03</text>
    <text x="158" y="345" class="lyr">Inference-aware routing</text>
    <text x="158" y="367" class="desc">Gateway API Inference Extension on agentgateway</text>
    <g class="mono"><rect x="605" y="334" width="43" height="26" rx="7" class="tag"/><text x="626" y="351" class="tagt" text-anchor="middle">GIE</text>
    <rect x="658" y="334" width="113" height="26" rx="7" class="tag"/><text x="714" y="351" class="tagt" text-anchor="middle">InferencePool</text>
    <rect x="781" y="334" width="43" height="26" rx="7" class="tag"/><text x="802" y="351" class="tagt" text-anchor="middle">EPP</text></g>
  </g>

  <!-- ============ LAYER 04 — Serving ============ -->
  <g>
    <rect x="80" y="406" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="449" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="426" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="453" class="idx mono">04</text>
    <text x="158" y="447" class="lyr">Serving runtime</text>
    <text x="158" y="469" class="desc">OpenAI-compatible model servers</text>
    <g class="mono"><rect x="633" y="436" width="50" height="26" rx="7" class="tag"/><text x="658" y="453" class="tagt" text-anchor="middle">vLLM</text>
    <rect x="693" y="436" width="64" height="26" rx="7" class="tag"/><text x="725" y="453" class="tagt" text-anchor="middle">KServe</text>
    <rect x="767" y="436" width="57" height="26" rx="7" class="tag"/><text x="795" y="453" class="tagt" text-anchor="middle">llm-d</text></g>
  </g>

  <!-- ============ LAYER 05 — GPU scheduling ============ -->
  <g>
    <rect x="80" y="508" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="551" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="528" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="555" class="idx mono">05</text>
    <text x="158" y="549" class="lyr">GPU scheduling and scaling</text>
    <text x="158" y="571" class="desc">Quota admission, queue-driven autoscale, telemetry</text>
    <g class="mono"><rect x="647" y="538" width="57" height="26" rx="7" class="tag"/><text x="675" y="555" class="tagt" text-anchor="middle">Kueue</text>
    <rect x="714" y="538" width="50" height="26" rx="7" class="tag"/><text x="739" y="555" class="tagt" text-anchor="middle">KEDA</text>
    <rect x="774" y="538" width="50" height="26" rx="7" class="tag"/><text x="799" y="555" class="tagt" text-anchor="middle">DCGM</text></g>
  </g>

  <!-- ============ LAYER 06 — Substrate ============ -->
  <g>
    <rect x="80" y="610" width="784" height="86" rx="11" fill="#242424" stroke="#333333"/>
    <circle cx="58" cy="653" r="3.5" fill="#8a8a8a"/>
    <rect x="100" y="630" width="3" height="46" rx="1.5" fill="#6a6a6a"/>
    <text x="120" y="657" class="idx mono">06</text>
    <text x="158" y="651" class="lyr">Cloud substrate · OpenTofu</text>
    <text x="158" y="673" class="desc">GKE cluster and Workload Identity</text>
    <g class="mono"><rect x="532" y="629" width="141" height="26" rx="7" class="tag"/><text x="602" y="646" class="tagt" text-anchor="middle">Workload Identity</text>
    <rect x="683" y="629" width="141" height="26" rx="7" class="tag"/><text x="753" y="646" class="tagt" text-anchor="middle">Artifact Registry</text>
    <rect x="679" y="661" width="43" height="26" rx="7" class="tag"/><text x="700" y="678" class="tagt" text-anchor="middle">GKE</text>
    <rect x="732" y="661" width="92" height="26" rx="7" class="tag"/><text x="778" y="678" class="tagt" text-anchor="middle">node pools</text></g>
  </g>

  <!-- ============ foundation row ============ -->
  <rect x="64" y="724" width="800" height="54" rx="10" fill="#202020" stroke="#2e2e2e"/>
  <text x="88" y="757" class="desc" fill="#9a9a9a">Spans every layer</text>
  <g class="mono"><rect x="404" y="738" width="120" height="26" rx="7" class="tag"/><text x="464" y="755" class="tagt" text-anchor="middle">Argo CD GitOps</text>
  <rect x="534" y="738" width="134" height="26" rx="7" class="tag"/><text x="601" y="755" class="tagt" text-anchor="middle">External Secrets</text>
  <rect x="678" y="738" width="162" height="26" rx="7" class="tag"/><text x="759" y="755" class="tagt" text-anchor="middle">Prometheus + Grafana</text></g>
</svg>
