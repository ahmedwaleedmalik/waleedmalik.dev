<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'Geist Mono Variable', ui-monospace, 'SF Mono', Menlo, monospace; }
      .cap  { fill:#8a8a8a; font-size:13.5px; }
      .box  { fill:#ededed; font-size:15px; font-weight:700; }
      .desc { fill:#8a8a8a; font-size:11.5px; }
      .lbl  { fill:#9a9a9a; font-size:11px; }
      .band { fill:#bcbcbc; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="10" fill="#1c1c1c"/>

  <!-- caption (heading lives in the prose, not here) -->
  <text x="40" y="50" class="cap">Economics and inference-routing are different layers. A real LLM service stacks both.</text>

  <!-- economics band -->
  <rect x="40" y="86" width="700" height="150" rx="12" fill="#202020" stroke="#333333"/>
  <text x="58" y="110" class="band mono">Economics · LiteLLM — "which tenant, how many dollars?"</text>

  <!-- developer -->
  <rect x="56" y="134" width="120" height="74" rx="11" fill="#262626" stroke="#383838"/>
  <text x="116" y="164" class="box" text-anchor="middle">Developer</text>
  <text x="116" y="186" class="desc mono" text-anchor="middle">virtual key</text>
  <path d="M178 171 h36" stroke="#6a6a6a" stroke-width="2"/><polygon points="216,171 206,167 206,175" fill="#6a6a6a"/>

  <!-- LiteLLM -->
  <rect x="218" y="122" width="196" height="98" rx="11" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="316" y="150" class="box" text-anchor="middle">LiteLLM proxy</text>
  <text x="316" y="172" class="desc" text-anchor="middle" font-size="10.5">virtual keys · per-key $ budget</text>
  <text x="316" y="189" class="desc" text-anchor="middle" font-size="10.5">spend ledger · 429 on limit reached</text>
  <text x="316" y="208" class="lbl mono" text-anchor="middle">the dollar question</text>

  <!-- Postgres -->
  <path d="M414 171 h36" stroke="#6a6a6a" stroke-width="2"/><polygon points="452,171 442,167 442,175" fill="#6a6a6a"/>
  <rect x="454" y="134" width="120" height="74" rx="11" fill="#262626" stroke="#383838"/>
  <text x="514" y="162" class="box" text-anchor="middle" font-size="14">Postgres</text>
  <text x="514" y="184" class="desc mono" text-anchor="middle">SpendLogs</text>

  <!-- Grafana (read only) -->
  <path d="M574 171 h36" stroke="#555555" stroke-width="1.6" stroke-dasharray="4 4"/><polygon points="610,171 600,167 600,175" fill="#555555"/>
  <rect x="612" y="134" width="116" height="74" rx="11" fill="#262626" stroke="#383838"/>
  <text x="670" y="162" class="box" text-anchor="middle" font-size="14">Grafana</text>
  <text x="670" y="184" class="desc" text-anchor="middle">spend by key</text>
  <text x="670" y="226" class="lbl mono" text-anchor="middle">read-only · OSS · $0</text>

  <!-- branch labels in the gap -->
  <text x="232" y="256" class="lbl mono">Single-replica: direct</text>
  <text x="392" y="256" class="lbl mono">Multi-replica: via GIE</text>

  <!-- routing band -->
  <rect x="40" y="280" width="880" height="158" rx="12" fill="#202020" stroke="#333333"/>
  <text x="58" y="304" class="band mono">inference-aware routing · GIE — "which of N identical pods, right now?"</text>

  <!-- GIE box -->
  <rect x="300" y="328" width="150" height="86" rx="11" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="375" y="356" class="box" text-anchor="middle" font-size="14">InferencePool</text>
  <text x="375" y="376" class="desc" text-anchor="middle">+ EPP scorer</text>
  <text x="375" y="395" class="lbl mono" text-anchor="middle">KV-cache / queue</text>

  <!-- vLLM coder pods stack -->
  <rect x="560" y="320" width="360" height="104" rx="11" fill="#212121" stroke="#333333"/>
  <text x="578" y="344" class="lbl mono">vLLM coder pods · one L4</text>
  <g>
    <rect x="578" y="356" width="104" height="52" rx="9" fill="#262626" stroke="#383838"/>
    <text x="630" y="379" class="box" text-anchor="middle" font-size="13">Chat</text>
    <text x="630" y="397" class="desc" text-anchor="middle" font-size="10">sidebar</text>
    <rect x="692" y="356" width="104" height="52" rx="9" fill="#262626" stroke="#6a5f44"/>
    <text x="744" y="379" class="box" text-anchor="middle" font-size="13" fill="#d8c08a">FIM</text>
    <text x="744" y="397" class="desc" text-anchor="middle" font-size="10" fill="#b3a079">autocomplete</text>
    <rect x="806" y="356" width="100" height="52" rx="9" fill="#262626" stroke="#383838"/>
    <text x="856" y="379" class="box" text-anchor="middle" font-size="13">Agent</text>
    <text x="856" y="397" class="desc" text-anchor="middle" font-size="10">tool-calling</text>
  </g>

  <!-- LiteLLM -> via GIE -->
  <path d="M350 220 C350 266, 375 286, 375 326" stroke="#6a6a6a" stroke-width="2" fill="none"/><polygon points="375,328 371,318 379,318" fill="#6a6a6a"/>
  <!-- GIE -> pods -->
  <path d="M450 368 h106" stroke="#9a9a9a" stroke-width="2.4"/><polygon points="558,368 548,364 548,372" fill="#9a9a9a"/>
  <!-- LiteLLM -> direct (bypass GIE) -->
  <path d="M400 218 C520 238, 650 282, 690 318" stroke="#6a6a6a" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/><polygon points="690,320 685,310 695,310" fill="#6a6a6a"/>

  <text x="56" y="480" class="desc" font-size="12.5">GIE sits behind the pool to route traffic when multiple models/GPUs are running.</text>
  <text x="56" y="504" class="desc" font-size="12.5">The seam is the point: LiteLLM never picks a pod, GIE never reads a budget. Stack them; don't make one do both.</text>
</svg>
